<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Echtzeit Timer</title>
  
  <!-- Entwickler-Konsole für Smartphones (Eruda) -->
  <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
  <script>eruda.init();</script>

  <!-- QR-Code Bibliothek für den Browser -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: #000;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      transition: background-color 0.4s ease;
      padding: 20px;
    }
    
    /* Warnung bei unter 2 Minuten */
    body.warning { background-color: #d9381e; }
    
    /* Wellenartiges/Sanftes Pulsieren nach Ablauf der Zeit */
    body.expired {
      animation: pulseRed 2s infinite ease-in-out;
    }

    @keyframes pulseRed {
      0% { background-color: #000000; }
      50% { background-color: #e61919; } /* Helleres Rot */
      100% { background-color: #000000; }
    }

    /* Kurzes blaues Aufleuchten bei Zeitänderung */
    body.flash { 
      background-color: #1e88e5 !important; 
      animation: none !important;
    }

    .timer-display {
      font-size: 5.5rem;
      font-weight: 800;
      margin: 15px 0;
      cursor: pointer;
      user-select: none;
      font-variant-numeric: tabular-nums;
    }

    .controls {
      display: flex;
      flex-direction: column;
      gap: 12px;
      align-items: center;
      width: 100%;
      max-width: 320px;
    }

    .btn-group { display: flex; gap: 10px; width: 100%; justify-content: center; }

    button {
      padding: 12px 18px;
      font-size: 1.1rem;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      background-color: #222;
      color: #fff;
      cursor: pointer;
      flex: 1;
      border: 1px solid #444;
    }
    button:active { background-color: #444; }

    .btn-action { background-color: #2e6da4; border-color: #357ebd; }
    
    .qr-panel {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      margin: 15px 0;
      background: #111;
      padding: 12px;
      border-radius: 12px;
    }

    #user-qr {
      padding: 8px;
      background: #fff;
      border-radius: 8px;
    }

    .status-text {
      font-size: 0.85rem;
      color: #aaa;
      text-align: center;
      margin-top: 5px;
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <!-- Steuerung OBEN (Nur für Admin) -->
  <div id="admin-top" class="controls hidden">
    <div class="btn-group">
      <button class="btn-action" onclick="startTimer()">Start</button>
      <button class="btn-action" onclick="pauseTimer()">Pause</button>
    </div>
    <div class="btn-group">
      <button onclick="changeTime(30)">+30 s</button>
      <button onclick="changeTime(60)">+1 min</button>
    </div>
  </div>

  <!-- Timer Anzeige -->
  <div class="timer-display" id="timer" onclick="manualEdit()">30:00</div>

  <!-- Status & Wachhalten -->
  <div class="controls">
    <button id="wake-lock-button" type="button" onclick="toggleWakeLock()">Bildschirm wach halten</button>
    <div id="sync-status" class="status-text">Verbinde mit Server...</div>
  </div>

  <!-- Steuerung UNTEN (Nur für Admin) -->
  <div id="admin-bottom" class="controls hidden" style="margin-top: 15px;">
    <div class="btn-group">
      <button onclick="changeTime(-30)">-30 s</button>
      <button onclick="changeTime(-60)">-1 min</button>
    </div>

    <!-- QR Code Bereich für Admin -->
    <div class="qr-panel">
      <div style="font-weight:bold; font-size:0.9rem;">QR-Code für Nutzer</div>
      <div id="user-qr"></div>
      <button onclick="copyUserLink()" style="font-size: 0.85rem; padding: 6px 10px;">Link kopieren</button>
    </div>
  </div>

  <!-- Firebase SDKs einbinden -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <script>
    // 1. FIREBASE KONFIGURATION
    const firebaseConfig = {
      apiKey: "AIzaSyBZ8TNHdABZ9YEl84jAltPC5_iEbZMYnB0",
      authDomain: "synchro-timer1.firebaseapp.com",
      databaseURL: "https://synchro-timer1-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "synchro-timer1",
      storageBucket: "synchro-timer1.firebasestorage.app",
      messagingSenderId: "681266055522",
      appId: "1:681266055522:web:5afc74a55e4710d340443b",
      measurementId: "G-W82QS25S5W"
    };

    try {
      firebase.initializeApp(firebaseConfig);
    } catch(e) {
      console.error("Firebase Init Fehler:", e);
    }
    
    const db = firebase.database().ref("timer_state");

    const isAdmin = new URLSearchParams(window.location.search).get('role') === 'admin';
    if (isAdmin) {
      document.getElementById('admin-top').classList.remove('hidden');
      document.getElementById('admin-bottom').classList.remove('hidden');
      setupQRCode();
    }

    // Timer Variablen
    let isRunning = false;
    let targetTime = 0;       // Timestamp in ms, wann Timer bei 00:00 ankommt
    let durationLeft = 1800;  // Verbleibende Sekunden bei Pause (Standard 30 min)
    
    let isInitialLoad = true;
    let lastDurationLeft = 1800;
    
    // Tracker für die 3 Alarm-Stufen
    let alertedStages = {
      zero: false,
      minus5: false,
      minus10: false
    };

    let wakeLock = null;
    const timerElement = document.getElementById('timer');
    const syncStatus = document.getElementById('sync-status');

    // 2. ECHTZEIT-SYNCHRONISATION MIT SERVER
    db.on('value', (snapshot) => {
      const data = snapshot.val();
      if (data) {
        // Prüfen ob Zeit manuell/über Buttons geändert wurde
        if (!isInitialLoad) {
          const expectedRemaining = data.isRunning ? Math.round((data.targetTime - Date.now()) / 1000) : data.durationLeft;
          if (Math.abs(expectedRemaining - lastDurationLeft) > 1) {
            triggerFlash();
          }
        }
        
        isRunning = data.isRunning;
        targetTime = data.targetTime || 0;
        durationLeft = data.durationLeft !== undefined ? data.durationLeft : 1800;
        
        // Alarme zurücksetzen, wenn der Timer wieder über 0 gesetzt wird
        const currentSecs = getCurrentSeconds();
        if (currentSecs > 0) {
          alertedStages.zero = false;
          alertedStages.minus5 = false;
          alertedStages.minus10 = false;
        }

        isInitialLoad = false;
        updateDisplay();
        
        syncStatus.textContent = "● Live synchronisiert";
        syncStatus.style.color = "#4CAF50";
      } else if (isAdmin) {
        pushState(false, 0, 1800);
      }
    }, (error) => {
      console.error("Firebase Datenbank-Fehler:", error);
      syncStatus.textContent = "Verbindungsfehler (Regeln prüfen)";
      syncStatus.style.color = "#f44336";
    });

    function pushState(runningState, target, duration) {
      if (!isAdmin) return;
      db.set({
        isRunning: runningState,
        targetTime: target,
        durationLeft: duration,
        updatedAt: Date.now()
      }).catch(err => console.error("Schreibfehler:", err));
    }

    // Berechnet die verbleibende Zeit in Sekunden absolut genau
    function getCurrentSeconds() {
      if (isRunning) {
        return Math.round((targetTime - Date.now()) / 1000);
      }
      return durationLeft;
    }

    // 3. TIMER DISPLAY & ALARM STUFEN
    function updateDisplay() {
      let secs = getCurrentSeconds();

      // Maximales Limit für Minus-Lauf auf -10 Minuten (-600 Sekunden) festlegen
      if (secs < -600) {
        secs = -600;
        if (isRunning && isAdmin) {
          // Automatisch stoppen bei -10 Minuten
          pushState(false, 0, -600);
        }
      }

      lastDurationLeft = secs;

      const isNegative = secs < 0;
      const absSeconds = Math.abs(secs);
      const displayMins = Math.floor(absSeconds / 60);
      const displaySecs = absSeconds % 60;
      
      timerElement.textContent = 
        `${isNegative ? '-' : ''}${displayMins.toString().padStart(2, '0')}:${displaySecs.toString().padStart(2, '0')}`;

      // Farblogik
      document.body.classList.remove('warning', 'expired');
      if (secs <= 0) {
        document.body.classList.add('expired');
      } else if (secs <= 120) {
        document.body.classList.add('warning');
      }

      // Alarm Stufen prüfen
      if (secs <= 0 && !alertedStages.zero) {
        playAlarmSound();
        alertedStages.zero = true;
      }
      if (secs <= -300 && !alertedStages.minus5) { // -5 Minuten
        playAlarmSound();
        alertedStages.minus5 = true;
      }
      if (secs <= -600 && !alertedStages.minus10) { // -10 Minuten
        playAlarmSound();
        alertedStages.minus10 = true;
      }
    }

    // Kontinuierliche Display-Aktualisierung (jede Sekunde)
    setInterval(updateDisplay, 1000);

    // 4. BEDIENUNG (ADMIN)
    function startTimer() {
      if (isRunning) return;
      let currentSecs = getCurrentSeconds();
      if (currentSecs <= -600) currentSecs = 1800; // Reset falls bei -10min abgelaufen
      
      const newTarget = Date.now() + (currentSecs * 1000);
      pushState(true, newTarget, currentSecs);
    }

    function pauseTimer() {
      if (!isRunning) return;
      const currentSecs = getCurrentSeconds();
      pushState(false, 0, currentSecs);
    }

    function changeTime(sec) {
      let currentSecs = getCurrentSeconds();
      let newSecs = currentSecs + sec;
      
      triggerFlash(); // Visuelles Feedback am Admin-Gerät
      
      if (isRunning) {
        const newTarget = Date.now() + (newSecs * 1000);
        pushState(true, newTarget, newSecs);
      } else {
        pushState(false, 0, newSecs);
      }
    }

    function manualEdit() {
      if (!isAdmin) return;
      const currentSecs = getCurrentSeconds();
      const input = prompt("Neue Zeit in Minuten eingeben:", Math.floor(currentSecs / 60));
      if (input !== null && !isNaN(input) && input.trim() !== "") {
        const newSecs = parseInt(input, 10) * 60;
        triggerFlash();
        if (isRunning) {
          const newTarget = Date.now() + (newSecs * 1000);
          pushState(true, newTarget, newSecs);
        } else {
          pushState(false, 0, newSecs);
        }
      }
    }

    // Blauer Blitz bei Zeitänderung
    function triggerFlash() {
      document.body.classList.add('flash');
      setTimeout(() => document.body.classList.remove('flash'), 500);
    }

    // MP3-Ton abspielen
    function playAlarmSound() {
      const audio = new Audio('alarm.mp3');
      audio.play().catch(e => {
        console.log("Audio-Wiedergabe vom Browser blockiert oder 'alarm.mp3' nicht gefunden:", e);
      });
    }

    // 5. HELFER (QR-Code & Wachhalten)
    function setupQRCode() {
      const userUrl = window.location.href.replace('?role=admin', '').replace('&role=admin', '');
      new QRCode(document.getElementById("user-qr"), {
        text: userUrl,
        width: 160,
        height: 160
      });
    }

    function copyUserLink() {
      const userUrl = window.location.href.replace('?role=admin', '').replace('&role=admin', '');
      navigator.clipboard.writeText(userUrl);
      alert("Nutzer-Link in Zwischenablage kopiert!");
    }

    async function toggleWakeLock() {
      const btn = document.getElementById('wake-lock-button');
      if (!wakeLock) {
        try {
          wakeLock = await navigator.wakeLock.request('screen');
          btn.textContent = "Bildschirm bleibt an (Aktiv)";
          btn.style.backgroundColor = "#1b5e20";
        } catch (e) {
          alert("Bildschirm wach halten wird nicht unterstützt.");
        }
      } else {
        await wakeLock.release();
        wakeLock = null;
        btn.textContent = "Bildschirm wach halten";
        btn.style.backgroundColor = "#222";
      }
    }
  </script>
</body>
</html>

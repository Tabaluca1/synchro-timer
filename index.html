<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Synchro Timer</title>

  <!-- QR-Code Bibliothek für den Browser -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<!-- Google Font: Roboto Mono laden -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;700;800&display=swap" rel="stylesheet">

  <style>
    /* =========================================
       1. GRUND-LAYOUT & GLOBALE STYLES
       ========================================= */
    * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
      font-family: 'Roboto Mono', monospace;
      background-color: #000;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      transition: background-color 0.4s ease;
      padding: 20px;
    }

    
    .hidden { display: none !important; }

    /* =========================================
       2. TIMER & ANIMATIONEN
       ========================================= */
    body.warning { background-color: #d9381e; }
    body.expired { animation: pulseRed 2s infinite ease-in-out; }
    body.flash { background-color: #1e88e5 !important; animation: none !important; }

    @keyframes pulseRed {
      0% { background-color: #000000; }
      50% { background-color: #e61919; }
      100% { background-color: #000000; }
    }

    .timer-display {
      font-size: 5.5rem;
      font-weight: 800;
      margin: 10px 0;
      cursor: pointer;
      user-select: none;
      font-variant-numeric: tabular-nums; /* Sorgt dafür, dass Zahlen nicht "wackeln" */
    }

    .status-text {
      font-size: 0.85rem;
      color: #aaa;
      text-align: center;
      margin-bottom: 15px;
    }

    /* =========================================
       3. BUTTONS & STEUERUNG
       ========================================= */
    .controls {
      display: flex;
      flex-direction: column;
      gap: 12px;
      align-items: center;
      width: 100%;
      max-width: 320px;
    }

    .btn-group { display: flex; gap: 10px; width: 100%; justify-content: center; }

    button {
      padding: 12px 18px;
      font-size: 1.1rem;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      background-color: #222;
      color: #fff;
      cursor: pointer;
      flex: 1;
      border: 1px solid #444;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    button:active { background-color: #444; }

    .btn-action { background-color: #2e6da4; border-color: #357ebd; }
    .btn-reset { background-color: #333; border-color: #555; }
    .btn-reset:active { background-color: #555; }

    #wake-lock-button {
      width: 100%;
      white-space: nowrap;
      font-size: clamp(0.75rem, 3.5vw, 0.95rem);
      padding: 12px 10px;
    }

    .icon-svg { width: 24px; height: 24px; fill: currentColor; }
    
    /* =========================================
       4. LOBBY & QR-PANEL
       ========================================= */
    .qr-panel {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
      background: #111;
      padding: 12px;
      border-radius: 12px;
    }

    #user-qr {
      padding: 8px;
      background: #fff;
      border-radius: 8px;
      cursor: pointer;
      user-select: none;
    }

    .lobby-card {
      background: #111;
      padding: 24px;
      border-radius: 16px;
      border: 1px solid #333;
      width: 100%;
      max-width: 340px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .lobby-card h2 { font-size: 1.5rem; text-align: center; }
    
    .form-group { display: flex; flex-direction: column; gap: 6px; }
    .form-group label { font-size: 0.9rem; color: #ccc; font-weight: bold; }
    .form-group input {
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #444;
      background: #222;
      color: #fff;
      font-size: 1rem;
    }
  </style>
</head>
<body>

  <!-- LOBBY / STARTSEITE -->
  <div id="lobby-view" class="lobby-card hidden">
    <h2>Synchro Timer</h2>
    <div id="lobby-step-1">
      <button class="btn-action" style="width: 100%; margin-top: 10px;" onclick="showSetupForm()">Timer erstellen</button>
    </div>
    <div id="lobby-step-2" class="hidden">
      <div class="form-group">
        <label for="room-name-input">Timer benennen</label>
        <input type="text" id="room-name-input" placeholder="z.B. countdown" autocomplete="off">
      </div>
      <div class="form-group" style="margin-top: 10px;">
        <label for="initial-time-input">Länge des Timers (Minuten)</label>
        <input type="number" id="initial-time-input" value="30" min="1" max="999">
      </div>
      <button class="btn-action" style="width: 100%; margin-top: 15px;" onclick="createRoom()">Timer einrichten</button>
    </div>
  </div>

  <!-- QR-CODE BEREICH (NUR ADMIN) -->
  <div id="admin-qr-panel" class="qr-panel hidden">
    <div style="font-weight:bold; font-size:0.9rem;">QR-Code für Nutzer</div>
    <div id="user-qr"></div>
    <button onclick="copyUserLink()" style="font-size: 0.85rem; padding: 6px 10px;">Link kopieren</button>
  </div>

  <!-- TIMER ANZEIGE -->
  <div class="timer-display hidden" id="timer" onclick="manualEdit()">30:00</div>

  <!-- LIVE STATUS -->
  <div id="sync-status" class="status-text hidden">Verbinde mit Server...</div>

  <!-- WACHHALTEN & SOUND BUTTON (NUR NUTZER) -->
  <div id="user-wake-lock" class="controls hidden">
    <button id="wake-lock-button" type="button" onclick="enableUserAudioAndWakeLock()">Ton & Bildschirm-Awake aktivieren</button>
  </div>

  <!-- BEDIENUNG ADMIN -->
  <div id="admin-controls" class="controls hidden">
    <div class="btn-group">
      <button id="toggle-btn" class="btn-action" onclick="togglePlayPause()" aria-label="Start/Pause">
        <svg id="play-icon" class="icon-svg" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        <svg id="pause-icon" class="icon-svg hidden" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
      </button>
      <button class="btn-reset" onclick="resetToDefaultTime()" aria-label="Reset">
        <svg class="icon-svg" viewBox="0 0 24 24"><path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/></svg>
      </button>
    </div>
    <div class="btn-group">
      <button onclick="changeTime(30)">+30 s</button>
      <button onclick="changeTime(60)">+1 min</button>
    </div>
    <div class="btn-group">
      <button onclick="changeTime(-30)">-30 s</button>
      <button onclick="changeTime(-60)">-1 min</button>
    </div>
  </div>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <script>
    "use strict"; // Sorgt für striktere Fehlerprüfung im Code

    /* ========================================================================
       1. SETUP & VARIABLEN
       ======================================================================== */
    const firebaseConfig = {
      apiKey: "AIzaSyBZ8TNHdABZ9YEl84jAltPC5_iEbZMYnB0",
      authDomain: "synchro-timer1.firebaseapp.com",
      databaseURL: "https://synchro-timer1-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "synchro-timer1",
      storageBucket: "synchro-timer1.firebasestorage.app",
      messagingSenderId: "681266055522",
      appId: "1:681266055522:web:5afc74a55e4710d340443b",
      measurementId: "G-W82QS25S5W"
    };

    try { firebase.initializeApp(firebaseConfig); } 
    catch(e) { console.error("Firebase Init Fehler:", e); }

    const urlParams = new URLSearchParams(window.location.search);
    const roomName = urlParams.get('room');
    const isAdmin = urlParams.get('role') === 'admin';

    const UI = {
      lobby: document.getElementById('lobby-view'),
      adminQr: document.getElementById('admin-qr-panel'),
      timer: document.getElementById('timer'),
      status: document.getElementById('sync-status'),
      userLock: document.getElementById('user-wake-lock'),
      adminControls: document.getElementById('admin-controls'),
      playIcon: document.getElementById('play-icon'),
      pauseIcon: document.getElementById('pause-icon')
    };

    let dbRef = null;
    let wakeLock = null;
    let displayInterval = null;

    // Timer State
    const state = {
      isRunning: false,
      targetTime: 0,
      durationLeft: 1800,
      defaultDuration: 1800,
      isInitialLoad: true,
      lastDurationLeft: 1800,
      alertedZero: false,
      alertedMinus2: false,
      alertedMinus5: false
    };


    /* ========================================================================
       2. AUDIO SYSTEM (Web Audio API)
       ======================================================================== */
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    const audioContext = new AudioCtx();
    let isAudioUnlocked = false;
    let alarmBuffer = null;

    // Hintergrund-Download der MP3
    fetch('alarm.mp3')
      .then(res => res.arrayBuffer())
      .then(buffer => audioContext.decodeAudioData(buffer))
      .then(decoded => { alarmBuffer = decoded; })
      .catch(err => console.error("Fehler beim Vorladen der MP3:", err));

    function unlockAudioSilent() {
      if (isAudioUnlocked) return;
      try {
        const buffer = audioContext.createBuffer(1, 22050, 22050);
        const source = audioContext.createBufferSource();
        source.buffer = buffer;
        source.loop = true;
        source.connect(audioContext.destination);
        source.start(0);

        if (audioContext.state === 'suspended') audioContext.resume();
        isAudioUnlocked = true;
      } catch (e) {
        console.warn("Audio-Unlock fehlgeschlagen:", e);
      }
    }

    function playAlarmSound() {
      if (audioContext.state === 'suspended') audioContext.resume();
      
      if (alarmBuffer) {
        const source = audioContext.createBufferSource();
        source.buffer = alarmBuffer;
        source.connect(audioContext.destination);
        source.start(0);
      } else {
        // Fallback, falls Fetch fehlschlug oder extrem langsam war
        new Audio('alarm.mp3').play().catch(() => {});
      }
    }


    /* ========================================================================
       3. ROUTING & LOBBY LOGIK
       ======================================================================== */
    if (!roomName) {
      UI.lobby.classList.remove('hidden');
    } else {
      // Wenn ein Raum geladen wird, Setup durchführen
      dbRef = firebase.database().ref("timer_state/" + roomName);
      
      UI.timer.classList.remove('hidden');
      UI.status.classList.remove('hidden');

      if (isAdmin) {
        UI.adminQr.classList.remove('hidden');
        UI.adminControls.classList.remove('hidden');
        setupQRCode();
        setupSecretEruda();
        enableAdminInteractiveWakeLock();
      } else {
        UI.userLock.classList.remove('hidden');
      }

      initTimerSync();
      // Intervall startet NUR, wenn wir auch wirklich in einem Raum sind
      displayInterval = setInterval(updateDisplay, 1000);
    }

    function showSetupForm() {
      document.getElementById('lobby-step-1').classList.add('hidden');
      document.getElementById('lobby-step-2').classList.remove('hidden');
    }

    function createRoom() {
      const nameInput = document.getElementById('room-name-input').value.trim().toLowerCase().replace(/[^a-z0-9_-]/g, '');
      const timeInput = parseInt(document.getElementById('initial-time-input').value, 10);

      if (!nameInput) return alert("Bitte gib einen gültigen Namen ein.");
      
      const initialSeconds = (!isNaN(timeInput) && timeInput > 0) ? timeInput * 60 : 1800;

      firebase.database().ref("timer_state/" + nameInput).set({
        isRunning: false,
        targetTime: 0,
        durationLeft: initialSeconds,
        defaultDuration: initialSeconds,
        updatedAt: Date.now()
      }).then(() => {
        window.location.href = `?room=${nameInput}&role=admin`;
      }).catch(() => alert("Fehler beim Erstellen des Timers."));
    }


    /* ========================================================================
       4. FIREBASE SYNC & TIMER BERECHNUNG
       ======================================================================== */
    function initTimerSync() {
      dbRef.on('value', (snapshot) => {
        const data = snapshot.val();
        if (data) {
          // Prüfen ob Sprung in der Zeit (manuelle Änderung) für Flash-Effekt
          if (!state.isInitialLoad) {
            const expected = data.isRunning ? Math.round((data.targetTime - Date.now()) / 1000) : data.durationLeft;
            if (Math.abs(expected - state.lastDurationLeft) > 1) triggerFlash();
          }
          
          state.isRunning = data.isRunning;
          state.targetTime = data.targetTime || 0;
          state.durationLeft = data.durationLeft ?? 1800;
          state.defaultDuration = data.defaultDuration ?? 1800;
          
          // UI Buttons aktualisieren
          UI.playIcon.classList.toggle('hidden', state.isRunning);
          UI.pauseIcon.classList.toggle('hidden', !state.isRunning);

          // Alarme zurücksetzen, wenn Timer wieder im Plus ist
          if (getCurrentSeconds() > 0) {
            state.alertedZero = false;
            state.alertedMinus2 = false;
            state.alertedMinus5 = false;
          }

          state.isInitialLoad = false;
          updateDisplay();
          
          UI.status.textContent = "● Live synchronisiert";
          UI.status.style.color = "#4CAF50";
        } else if (isAdmin) {
          pushState(false, 0, 1800, 1800);
        }
      }, () => {
        UI.status.textContent = "Verbindungsfehler";
        UI.status.style.color = "#f44336";
      });
    }

    function pushState(running, target, duration, defaultDur = state.defaultDuration) {
      if (!isAdmin || !dbRef) return;
      dbRef.set({
        isRunning: running,
        targetTime: target,
        durationLeft: duration,
        defaultDuration: defaultDur,
        updatedAt: Date.now()
      }).catch(err => console.error("Schreibfehler:", err));
    }

    function getCurrentSeconds() {
      return state.isRunning ? Math.round((state.targetTime - Date.now()) / 1000) : state.durationLeft;
    }

    function updateDisplay() {
      let secs = getCurrentSeconds();

      // Auto-Reset bei -10 Minuten
      if (secs <= -600) {
        secs = state.defaultDuration;
        state.alertedZero = false;
        state.alertedMinus2 = false;
        state.alertedMinus5 = false;
        if (isAdmin) pushState(false, 0, state.defaultDuration, state.defaultDuration);
      }

      state.lastDurationLeft = secs;

      // Zeit-Formatierung
      const isNegative = secs < 0;
      const absSecs = Math.abs(secs);
      const m = Math.floor(absSecs / 60).toString().padStart(2, '0');
      const s = (absSecs % 60).toString().padStart(2, '0');
      
      UI.timer.textContent = `${isNegative ? '-' : ''}${m}:${s}`;

      // Hintergrundfarben (Warnung/Abgelaufen)
      document.body.classList.remove('warning', 'expired');
      if (secs <= 0) document.body.classList.add('expired');
      else if (secs <= 120) document.body.classList.add('warning');

      // Alarm-Trigger
      if (secs <= 0 && !state.alertedZero) {
        playAlarmSound();
        state.alertedZero = true;
      }
      if (secs <= -120 && !state.alertedMinus2) {
        playAlarmSound();
        state.alertedMinus2 = true;
      }
      if (secs <= -300 && !state.alertedMinus5) {
        playAlarmSound();
        state.alertedMinus5 = true;
      }
    }


    /* ========================================================================
       5. ADMIN BEDIENUNG
       ======================================================================== */
    function togglePlayPause() {
      unlockAudioSilent();
      const currentSecs = getCurrentSeconds();
      if (state.isRunning) {
        pushState(false, 0, currentSecs);
      } else {
        pushState(true, Date.now() + (currentSecs * 1000), currentSecs);
      }
    }

    function resetToDefaultTime() {
      if (!isAdmin) return;
      unlockAudioSilent();
      pushState(false, 0, state.defaultDuration, state.defaultDuration);
    }

    function changeTime(sec) {
      unlockAudioSilent();
      const newSecs = getCurrentSeconds() + sec;
      triggerFlash();
      if (state.isRunning) {
        pushState(true, Date.now() + (newSecs * 1000), newSecs);
      } else {
        pushState(false, 0, newSecs);
      }
    }

    function manualEdit() {
      if (!isAdmin) return;
      unlockAudioSilent();
      const input = prompt("Neue Zeit in Minuten eingeben:", Math.floor(getCurrentSeconds() / 60));
      if (input !== null && !isNaN(input) && input.trim() !== "") {
        const newSecs = parseInt(input, 10) * 60;
        triggerFlash();
        state.isRunning 
          ? pushState(true, Date.now() + (newSecs * 1000), newSecs)
          : pushState(false, 0, newSecs);
      }
    }

    function triggerFlash() {
      document.body.classList.add('flash');
      setTimeout(() => document.body.classList.remove('flash'), 500);
    }


    /* ========================================================================
       6. HILFS-FUNKTIONEN (QR, Eruda, WakeLock)
       ======================================================================== */
    function getUserUrl() {
      const url = new URL(window.location.href);
      url.searchParams.delete('role');
      return url.toString();
    }

    function setupQRCode() {
      new QRCode(document.getElementById("user-qr"), { text: getUserUrl(), width: 160, height: 160 });
    }

    function copyUserLink() {
      navigator.clipboard.writeText(getUserUrl());
      alert("Nutzer-Link in Zwischenablage kopiert!");
    }

    async function requestWakeLock() {
      if (!wakeLock) {
        try { wakeLock = await navigator.wakeLock.request('screen'); } 
        catch (e) { /* Wird silently ignoriert wenn nicht unterstützt */ }
      }
    }

    // WakeLock für Admin (passiert unsichtbar beim ersten Klick)
    function enableAdminInteractiveWakeLock() {
      const initLock = () => {
        unlockAudioSilent();
        requestWakeLock();
      };
      document.addEventListener('pointerdown', initLock, { once: true });
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') {
          if (audioContext.state === 'suspended') audioContext.resume();
          document.addEventListener('pointerdown', initLock, { once: true });
        } else {
          wakeLock = null;
        }
      });
    }

    // WakeLock für normale Nutzer (über Button)
    async function enableUserAudioAndWakeLock() {
      unlockAudioSilent();
      const btn = document.getElementById('wake-lock-button');
      
      if (!wakeLock) {
        await requestWakeLock();
        btn.textContent = "Ton & Bildschirm-Awake aktiv ✓";
        btn.style.backgroundColor = "#1b5e20";
      } else {
        await wakeLock.release();
        wakeLock = null;
        btn.textContent = "Ton & Bildschirm-Awake aktivieren";
        btn.style.backgroundColor = "#222";
      }
    }

    // Easter-Egg: Entwickler-Konsole auf dem Handy öffnen (3x Klick auf QR Code)
    function setupSecretEruda() {
      let tapCount = 0, tapTimer = null;
      document.getElementById("user-qr").addEventListener('click', () => {
        tapCount++;
        clearTimeout(tapTimer);
        if (tapCount === 3) {
          tapCount = 0;
          if (window.eruda) window.eruda.show();
          else {
            const script = document.createElement('script');
            script.src = 'https://cdn.jsdelivr.net/npm/eruda';
            script.onload = () => { window.eruda.init(); window.eruda.show(); };
            document.body.appendChild(script);
          }
        } else {
          tapTimer = setTimeout(() => tapCount = 0, 1000);
        }
      });
    }
  </script>

  <!-- Footer-Bereich der Start & Admin-Seite -->
<footer style="text-align: center; padding: 20px; font-size: 12px; color: #888; margin-top: 40px;">
    Version 1.0
</footer>

</body>
</html>

<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Synchro Timer</title>

  <!-- QR-Code Bibliothek für den Browser -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: #000;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      transition: background-color 0.4s ease;
      padding: 20px;
    }
    
    /* Warnung bei unter 2 Minuten */
    body.warning { background-color: #d9381e; }
    
    /* Wellenartiges Pulsieren nach Ablauf der Zeit */
    body.expired {
      animation: pulseRed 2s infinite ease-in-out;
    }

    @keyframes pulseRed {
      0% { background-color: #000000; }
      50% { background-color: #e61919; }
      100% { background-color: #000000; }
    }

    /* Kurzes blaues Aufleuchten bei Zeitänderung */
    body.flash { 
      background-color: #1e88e5 !important; 
      animation: none !important;
    }

    .timer-display {
      font-size: 5.5rem;
      font-weight: 800;
      margin: 10px 0;
      cursor: pointer;
      user-select: none;
      font-variant-numeric: tabular-nums;
    }

    .controls {
      display: flex;
      flex-direction: column;
      gap: 12px;
      align-items: center;
      width: 100%;
      max-width: 320px;
    }

    .btn-group { display: flex; gap: 10px; width: 100%; justify-content: center; }

    button {
      padding: 12px 18px;
      font-size: 1.1rem;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      background-color: #222;
      color: #fff;
      cursor: pointer;
      flex: 1;
      border: 1px solid #444;
    }
    button:active { background-color: #444; }

    .btn-action { background-color: #2e6da4; border-color: #357ebd; }
    
    .qr-panel {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
      background: #111;
      padding: 12px;
      border-radius: 12px;
    }

    #user-qr {
      padding: 8px;
      background: #fff;
      border-radius: 8px;
      cursor: pointer;
      user-select: none;
    }

    .status-text {
      font-size: 0.85rem;
      color: #aaa;
      text-align: center;
      margin-bottom: 15px;
    }

    /* STARTSEITE / LOBBY STYLES */
    .lobby-card {
      background: #111;
      padding: 24px;
      border-radius: 16px;
      border: 1px solid #333;
      width: 100%;
      max-width: 340px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .lobby-card h2 { font-size: 1.5rem; text-align: center; }
    .form-group { display: flex; flex-direction: column; gap: 6px; }
    .form-group label { font-size: 0.9rem; color: #ccc; font-weight: bold; }
    .form-group input {
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #444;
      background: #222;
      color: #fff;
      font-size: 1rem;
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <!-- 0. LOBBY / STARTSEITE (Wenn kein Raum gewählt ist) -->
  <div id="lobby-view" class="lobby-card hidden">
    <h2>Synchro Timer</h2>
    
    <div id="lobby-step-1">
      <button class="btn-action" style="width: 100%; margin-top: 10px;" onclick="showSetupForm()">Timer erstellen</button>
    </div>

    <div id="lobby-step-2" class="hidden">
      <div class="form-group">
        <label for="room-name-input">Timer benennen</label>
        <input type="text" id="room-name-input" placeholder="z.B. countdown" autocomplete="off">
      </div>
      
      <div class="form-group" style="margin-top: 10px;">
        <label for="initial-time-input">Länge des Timers (Minuten)</label>
        <input type="number" id="initial-time-input" value="30" min="1" max="999">
      </div>

      <button class="btn-action" style="width: 100%; margin-top: 15px;" onclick="createRoom()">Timer einrichten</button>
    </div>
  </div>

  <!-- 1. QR-CODE BEREICH (NUR ADMIN) -->
  <div id="admin-qr-panel" class="qr-panel hidden">
    <div style="font-weight:bold; font-size:0.9rem;">QR-Code für Nutzer</div>
    <div id="user-qr"></div>
    <button onclick="copyUserLink()" style="font-size: 0.85rem; padding: 6px 10px;">Link kopieren</button>
  </div>

  <!-- 2. TIMER ANZEIGE -->
  <div class="timer-display hidden" id="timer" onclick="manualEdit()">30:00</div>

  <!-- 3. LIVE STATUS -->
  <div id="sync-status" class="status-text hidden">Verbinde mit Server...</div>

  <!-- 4. WACHHALTEN BUTTON (NUR NUTZER) -->
  <div id="user-wake-lock" class="controls hidden">
    <button id="wake-lock-button" type="button" onclick="toggleWakeLock()">Bildschirm wach halten</button>
  </div>

  <!-- 5. BEDIENUNG ADMIN (START/PAUSE & ZEIT-BUTTONS) -->
  <div id="admin-controls" class="controls hidden">
    <div class="btn-group">
      <button class="btn-action" onclick="startTimer()">Start</button>
      <button class="btn-action" onclick="pauseTimer()">Pause</button>
    </div>
    <div class="btn-group">
      <button onclick="changeTime(30)">+30 s</button>
      <button onclick="changeTime(60)">+1 min</button>
    </div>
    <div class="btn-group">
      <button onclick="changeTime(-30)">-30 s</button>
      <button onclick="changeTime(-60)">-1 min</button>
    </div>
  </div>

  <!-- Firebase SDKs einbinden -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <script>
    // 1. FIREBASE KONFIGURATION
    const firebaseConfig = {
      apiKey: "AIzaSyBZ8TNHdABZ9YEl84jAltPC5_iEbZMYnB0",
      authDomain: "synchro-timer1.firebaseapp.com",
      databaseURL: "https://synchro-timer1-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "synchro-timer1",
      storageBucket: "synchro-timer1.firebasestorage.app",
      messagingSenderId: "681266055522",
      appId: "1:681266055522:web:5afc74a55e4710d340443b",
      measurementId: "G-W82QS25S5W"
    };

    try {
      firebase.initializeApp(firebaseConfig);
    } catch(e) {
      console.error("Firebase Init Fehler:", e);
    }

    // URL-PARAMETER AUSLESEN
    const urlParams = new URLSearchParams(window.location.search);
    const roomName = urlParams.get('room');
    const isAdmin = urlParams.get('role') === 'admin';

    // UI ELEMNETE
    const lobbyView = document.getElementById('lobby-view');
    const adminQrPanel = document.getElementById('admin-qr-panel');
    const timerElement = document.getElementById('timer');
    const syncStatus = document.getElementById('sync-status');
    const userWakeLock = document.getElementById('user-wake-lock');
    const adminControls = document.getElementById('admin-controls');

    // TIMER VARIABLEN
    let db = null;
    let isRunning = false;
    let targetTime = 0;
    let durationLeft = 1800;
    let defaultDuration = 1800; // Standard oder vom Admin gewählte Startzeit in s
    
    let isInitialLoad = true;
    let lastDurationLeft = 1800;
    
    let alertedStages = {
      zero: false,
      minus5: false
    };

    let wakeLock = null;

    // A. PRÜFEN: SIND WIR IN EINEM RAUM ODER AUF DER STARTSEITE?
    if (!roomName) {
      // Startseite anzeigen
      lobbyView.classList.remove('hidden');
    } else {
      // Timer Ansicht laden
      db = firebase.database().ref("timer_state/" + roomName);
      
      timerElement.classList.remove('hidden');
      syncStatus.classList.remove('hidden');

      if (isAdmin) {
        adminQrPanel.classList.remove('hidden');
        adminControls.classList.remove('hidden');
        setupQRCode();
        setupSecretEruda();
      } else {
        userWakeLock.classList.remove('hidden');
      }

      initTimerSync();
    }

    // B. STARTSEITEN-LOGIK
    function showSetupForm() {
      document.getElementById('lobby-step-1').classList.add('hidden');
      document.getElementById('lobby-step-2').classList.remove('hidden');
    }

    function createRoom() {
      const nameInput = document.getElementById('room-name-input').value.trim().toLowerCase().replace(/[^a-z0-9_-]/g, '');
      const timeInput = parseInt(document.getElementById('initial-time-input').value, 10);

      if (!nameInput) {
        alert("Bitte gib einen gültigen Namen für den Timer ein.");
        return;
      }

      const initialSeconds = (!isNaN(timeInput) && timeInput > 0) ? timeInput * 60 : 1800;

      // Raum in Firebase anlegen
      const newDb = firebase.database().ref("timer_state/" + nameInput);
      newDb.set({
        isRunning: false,
        targetTime: 0,
        durationLeft: initialSeconds,
        defaultDuration: initialSeconds,
        updatedAt: Date.now()
      }).then(() => {
        // Weiterleitung auf die Admin-Seite
        window.location.href = `?room=${nameInput}&role=admin`;
      }).catch(err => {
        console.error("Fehler beim Erstellen:", err);
        alert("Fehler beim Erstellen des Timers.");
      });
    }

    // C. ECHTZEIT-SYNCHRONISATION MIT SERVER
    function initTimerSync() {
      db.on('value', (snapshot) => {
        const data = snapshot.val();
        if (data) {
          // Prüfen ob Zeit manuell/über Buttons geändert wurde
          if (!isInitialLoad) {
            const expectedRemaining = data.isRunning ? Math.round((data.targetTime - Date.now()) / 1000) : data.durationLeft;
            if (Math.abs(expectedRemaining - lastDurationLeft) > 1) {
              triggerFlash();
            }
          }
          
          isRunning = data.isRunning;
          targetTime = data.targetTime || 0;
          durationLeft = data.durationLeft !== undefined ? data.durationLeft : 1800;
          defaultDuration = data.defaultDuration !== undefined ? data.defaultDuration : 1800;
          
          // Alarme zurücksetzen
          const currentSecs = getCurrentSeconds();
          if (currentSecs > 0) {
            alertedStages.zero = false;
            alertedStages.minus5 = false;
          }

          isInitialLoad = false;
          updateDisplay();
          
          syncStatus.textContent = "● Live synchronisiert";
          syncStatus.style.color = "#4CAF50";
        } else if (isAdmin) {
          pushState(false, 0, 1800, 1800);
        }
      }, (error) => {
        console.error("Firebase Datenbank-Fehler:", error);
        syncStatus.textContent = "Verbindungsfehler";
        syncStatus.style.color = "#f44336";
      });
    }

    function pushState(runningState, target, duration, defDur) {
      if (!isAdmin || !db) return;
      db.set({
        isRunning: runningState,
        targetTime: target,
        durationLeft: duration,
        defaultDuration: defDur !== undefined ? defDur : defaultDuration,
        updatedAt: Date.now()
      }).catch(err => console.error("Schreibfehler:", err));
    }

    function getCurrentSeconds() {
      if (isRunning) {
        return Math.round((targetTime - Date.now()) / 1000);
      }
      return durationLeft;
    }

    // D. TIMER DISPLAY & RESET BEI -10 MINUTEN
    function updateDisplay() {
      if (!roomName) return;
      let secs = getCurrentSeconds();

      // Automatischer Reset bei -10 Minuten auf die gewählte Startzeit
      if (secs <= -600) {
        secs = defaultDuration;
        alertedStages.zero = false;
        alertedStages.minus5 = false;
        if (isAdmin) {
          pushState(false, 0, defaultDuration, defaultDuration);
        }
      }

      lastDurationLeft = secs;

      const isNegative = secs < 0;
      const absSeconds = Math.abs(secs);
      const displayMins = Math.floor(absSeconds / 60);
      const displaySecs = absSeconds % 60;
      
      timerElement.textContent = 
        `${isNegative ? '-' : ''}${displayMins.toString().padStart(2, '0')}:${displaySecs.toString().padStart(2, '0')}`;

      // Farblogik
      document.body.classList.remove('warning', 'expired');
      if (secs <= 0) {
        document.body.classList.add('expired');
      } else if (secs <= 120) {
        document.body.classList.add('warning');
      }

      // Alarm Stufen
      if (secs <= 0 && !alertedStages.zero) {
        playAlarmSound();
        alertedStages.zero = true;
      }
      if (secs <= -300 && !alertedStages.minus5) {
        playAlarmSound();
        alertedStages.minus5 = true;
      }
    }

    setInterval(updateDisplay, 1000);

    // E. BEDIENUNG (ADMIN)
    function startTimer() {
      if (isRunning) return;
      let currentSecs = getCurrentSeconds();
      const newTarget = Date.now() + (currentSecs * 1000);
      pushState(true, newTarget, currentSecs);
    }

    function pauseTimer() {
      if (!isRunning) return;
      const currentSecs = getCurrentSeconds();
      pushState(false, 0, currentSecs);
    }

    function changeTime(sec) {
      let currentSecs = getCurrentSeconds();
      let newSecs = currentSecs + sec;
      
      triggerFlash();
      
      if (isRunning) {
        const newTarget = Date.now() + (newSecs * 1000);
        pushState(true, newTarget, newSecs);
      } else {
        pushState(false, 0, newSecs);
      }
    }

    function manualEdit() {
      if (!isAdmin) return;
      const currentSecs = getCurrentSeconds();
      const input = prompt("Neue Zeit in Minuten eingeben:", Math.floor(currentSecs / 60));
      if (input !== null && !isNaN(input) && input.trim() !== "") {
        const newSecs = parseInt(input, 10) * 60;
        triggerFlash();
        if (isRunning) {
          const newTarget = Date.now() + (newSecs * 1000);
          pushState(true, newTarget, newSecs);
        } else {
          pushState(false, 0, newSecs);
        }
      }
    }

    function triggerFlash() {
      document.body.classList.add('flash');
      setTimeout(() => document.body.classList.remove('flash'), 500);
    }

    function playAlarmSound() {
      const audio = new Audio('alarm.mp3');
      audio.play().catch(e => {
        console.log("Audio-Wiedergabe vom Browser blockiert:", e);
      });
    }

    // F. HELFER (QR-Code, Wachhalten & Verstecktes Eruda)
    function getUserUrl() {
      const url = new URL(window.location.href);
      url.searchParams.delete('role');
      return url.toString();
    }

    function setupQRCode() {
      new QRCode(document.getElementById("user-qr"), {
        text: getUserUrl(),
        width: 160,
        height: 160
      });
    }

    function setupSecretEruda() {
      const qrElem = document.getElementById("user-qr");
      let tapCount = 0;
      let tapTimer = null;

      qrElem.addEventListener('click', () => {
        tapCount++;
        clearTimeout(tapTimer);

        if (tapCount === 3) {
          tapCount = 0;
          if (window.eruda) {
            window.eruda.show();
          } else {
            const script = document.createElement('script');
            script.src = 'https://cdn.jsdelivr.net/npm/eruda';
            script.onload = () => {
              window.eruda.init();
              window.eruda.show();
            };
            document.body.appendChild(script);
          }
        } else {
          tapTimer = setTimeout(() => { tapCount = 0; }, 1000);
        }
      });
    }

    function copyUserLink() {
      navigator.clipboard.writeText(getUserUrl());
      alert("Nutzer-Link in Zwischenablage kopiert!");
    }

    async function toggleWakeLock() {
      const btn = document.getElementById('wake-lock-button');
      if (!wakeLock) {
        try {
          wakeLock = await navigator.wakeLock.request('screen');
          btn.textContent = "Bildschirm bleibt an (Aktiv)";
          btn.style.backgroundColor = "#1b5e20";
        } catch (e) {
          alert("Bildschirm wach halten wird nicht unterstützt.");
        }
      } else {
        await wakeLock.release();
        wakeLock = null;
        btn.textContent = "Bildschirm wach halten";
        btn.style.backgroundColor = "#222";
      }
    }
  </script>
</body>
</html>
